name: Générer le Standalone EXE

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Récupérer le code source
      uses: actions/checkout@v4

    - name: Installer le SDK .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.x'

    - name: Restaurer les dépendances
      run: dotnet restore

    - name: Compiler et Publier l'exécutable Standalone Unique
      run: dotnet publish --configuration Release

    - name: Téléverser le fichier .EXE final
      uses: actions/upload-artifact@v4
      with:
        name: XavuiserieZombieSolver
        path: '**/bin/Release/net10.0-windows/win-x64/publish/*.exe'
