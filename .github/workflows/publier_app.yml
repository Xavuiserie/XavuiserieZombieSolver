name: Générer le Standalone EXE

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    permissions:
      contents: write

    steps:
    - name: Récupérer le code source
      uses: actions/checkout@v4

    - name: Installer le SDK .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.x'

    - name: Restaurer les dépendances
      run: dotnet restore

    - name: Compiler et Publier l'exécutable Standalone Unique
      run: dotnet publish --configuration Release

    - name: Créer une Release et publier le fichier .EXE
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/master'
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Version Automatique v1.0.${{ github.run_number }}
        draft: false
        prerelease: false
        files: '**/bin/Release/net10.0-windows/win-x64/publish/*.exe'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
